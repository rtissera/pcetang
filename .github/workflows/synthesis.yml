name: synthesis

# Real gw_sh synthesis + place-and-route for all three boards, with a hard gate on
# timing violations.
#
# WHY SELF-HOSTED: Gowin EDA is proprietary and cannot be redistributed into a hosted
# runner. The open-source route (Yosys + nextpnr + Apicula) is not a substitute either --
# GW5A support is weak, these sources are VHDL, and the timing margins here are razor
# thin (+0.105% on Console 60K), so a different place-and-route would not reproduce the
# bitstream that was actually validated on hardware.
#
# Runs on SER6MAX (Ryzen 9 6900HX), where Gowin Education lives at ~/gowin-edu.
# Education edition needs no licence file, which is what makes this portable at all.
#
# SECURITY: this executes on a machine on the author's LAN. Keep it to this repository's
# own branches -- never enable it for pull requests from forks.

# No `pull_request` trigger, on purpose (see SECURITY above): a PR runs the workflow file
# from the PR itself, so a guard in this file cannot protect the runner from a fork.
on:
  push:
    branches: [main, master]
    # A version tag also builds and drafts a release with the Console 60K bitstream.
    tags: ['v*']
  workflow_dispatch:
  schedule:
    # Nightly, so a slow drift in timing margin is caught even without a push.
    - cron: '0 2 * * *'

jobs:
  build:
    runs-on: [self-hosted, gowin]
    # SECURITY: these run on a self-hosted runner on the author's LAN. Allow pushes,
    # dispatches and schedules, and PRs raised from a branch INSIDE this repository --
    # but never a pull request from a fork, which would execute a stranger's code on
    # that machine. This matters the moment the repository becomes public.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: console60k
            tcl: build_console60k_cd.tcl
            top: pcetang_console60k_cd
          - board: primer25k
            tcl: build_primer25k_cd.tcl
            top: pcetang_primer25k_cd
          - board: nano20k
            tcl: build_nano20k_cd.tcl
            top: pcetang_nano20k_cd

    steps:
      - uses: actions/checkout@v4

      - name: Synthesise ${{ matrix.board }}
        run: |
          set -o pipefail
          # A stale netlist is a real hazard here: rebuilding after only a shared
          # (non-top-level) file changed can silently reuse the previous synthesis.
          rm -rf impl/gwsynthesis impl/pnr
          # gw_sh unconditionally initialises Qt even for a pure Tcl run. On a headless
          # box its bundled xcb plugin aborts with "Could not load the Qt platform plugin
          # xcb". The dev machine papers over this with xvfb-run; QT_QPA_PLATFORM=offscreen
          # is the better fix -- no X server at all, and one less moving part.
          # LD_PRELOAD: system fontconfig needs a newer libfreetype symbol than Gowin's
          # bundled copy provides. LD_LIBRARY_PATH: a bundled lib pulls libQt5DBus via a
          # transitive dep whose rpath misses IDE/lib, so it would grab the system Qt and
          # die on a version mismatch.
          QT_QPA_PLATFORM=offscreen \
          LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libfreetype.so.6 \
          LD_LIBRARY_PATH=$HOME/gowin-edu/IDE/lib \
          LIBGL_ALWAYS_SOFTWARE=1 \
          $HOME/gowin-edu/IDE/bin/gw_sh ${{ matrix.tcl }} 2>&1 | tee gw_sh_${{ matrix.board }}.log

      - name: Gate on timing and report resources
        run: |
          python3 - <<'PY'
          import re, html, sys, glob, os
          board = "${{ matrix.board }}"
          top   = "${{ matrix.top }}"

          bit = f"impl/pnr/{top}.bin"
          if not os.path.exists(bit):
              print(f"FAIL: no bitstream at {bit}"); sys.exit(1)

          # Timing lives in the HTML timing report; flatten the tags and read the numbers.
          tr = f"impl/pnr/{top}_tr_content.html"
          if not os.path.exists(tr):
              print(f"FAIL: no timing report at {tr}"); sys.exit(1)
          t = html.unescape(re.sub('<[^>]+>', ' ', open(tr, errors='replace').read()))
          t = re.sub(r'\s+', ' ', t)

          setup = re.search(r'Numbers of Setup Violated Endpoints (\d+)', t)
          hold  = re.search(r'Numbers of Hold Violated Endpoints (\d+)', t)
          if not setup or not hold:
              print("FAIL: could not parse violation counts"); sys.exit(1)
          s, h = int(setup.group(1)), int(hold.group(1))
          print(f"{board}: setup violations={s} hold violations={h}")

          # Fmax vs constraint, per clock -- the margin is what actually drifts.
          for m in re.finditer(r'(\w+) ([\d.]+)\(MHz\) ([\d.]+)\(MHz\)', t):
              clk, req, act = m.group(1), float(m.group(2)), float(m.group(3))
              print(f"  {clk}: constraint {req} MHz, actual {act} MHz ({(act/req-1)*100:+.3f}%)")

          rpt = f"impl/pnr/{top}.rpt.txt"
          if os.path.exists(rpt):
              for line in open(rpt, errors='replace'):
                  if re.match(r'\s+(Logic|Register|BSRAM|DSP)\s+\|', line):
                      print("  " + line.strip())

          if s or h:
              print(f"FAIL: {board} does not close timing"); sys.exit(1)
          print(f"PASS: {board} closes timing, bitstream {os.path.getsize(bit)} bytes")
          PY

      - name: Checksum
        run: md5sum impl/pnr/${{ matrix.top }}.bin impl/pnr/${{ matrix.top }}.fs

      - uses: actions/upload-artifact@v4
        # always(), because a FAILING build is exactly when the timing report is wanted.
        # This step's default condition is success(), so a timing failure printed three
        # violation counts and then let the cleanup step delete the report that says WHICH
        # paths they were -- costing a full rebuild to find out. (The previous commit's
        # message claimed this fix; it belongs here.)
        if: always()
        with:
          name: bitstream-${{ matrix.board }}
          path: |
            impl/pnr/${{ matrix.top }}.bin
            impl/pnr/${{ matrix.top }}.fs
            impl/pnr/${{ matrix.top }}.rpt.txt
            # The timing report the gate above parses. Worth keeping: without it the only
            # record of per-clock margin is whatever the gate chose to print, and checking
            # a clock it did not print (clk_5x_pixel, which has no timed paths and so no
            # Fmax row) means re-running the whole build.
            impl/pnr/${{ matrix.top }}_tr_content.html
            # Per-module resource breakdown (6-column table: the only hierarchical LUT/FF/BSRAM
            # figures Gowin produces; the PnR report is chip totals). NOT the .vg netlist --
            # Gowin Education encrypts it, so it cannot be parsed.
            impl/gwsynthesis/${{ matrix.top }}_syn.rpt.html
            impl/gwsynthesis/${{ matrix.top }}_syn_resource.html
            gw_sh_${{ matrix.board }}.log
          # warn, not error: when gw_sh itself fails there are no files, and a hard
          # error here would mask the real failure with a missing-artifact one.
          if-no-files-found: warn

      - name: Clean the workspace
        if: always()
        # Each run is ~2 GB of intermediates; three boards nightly fills a disk fast.
        run: rm -rf impl/gwsynthesis impl/pnr

  # Tag -> draft release with the Console 60K bitstream, the only board that loads games.
  # Runs on a GitHub-hosted runner: it only downloads the artifact the self-hosted build
  # uploaded, so nothing here touches the author's LAN.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bitstream-console60k
          path: dist

      - name: Package
        run: |
          cd dist
          # upload-artifact keeps the impl/pnr/ layout, so find the bitstream wherever it is
          f=$(find . -name pcetang_console60k_cd.bin -print -quit)
          test -n "$f"
          mv "$f" pcetang.bin
          md5sum pcetang.bin | tee MD5SUMS.txt
          sha256sum pcetang.bin | tee SHA256SUMS.txt

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          PC Engine / TurboGrafx-16 / CD-ROM² / SuperGrafx core for the **Sipeed Tang Console 60K**.

          - `pcetang.bin` goes to `cores/console60k/pcetang.bin` on the SD card (the name is fixed).
          - Requires the TangCore BL616 firmware fork, **v0.2.0 or later**:
            https://github.com/rtissera/firmware-bl616/releases
            Stock TangCore firmware cannot load this core.
          - CD games: `.chd` only, plus `bios/syscard3.pce` (System Card 3.0).

          Primer 25K and Nano 20K are not included: they cannot load games yet
          (external MCU wiring in progress). See `README.md` for status and known issues.
          EOF
          gh release create "$TAG" --repo "${{ github.repository }}" --draft --title "$TAG" \
            --notes-file notes.md dist/pcetang.bin dist/MD5SUMS.txt dist/SHA256SUMS.txt
